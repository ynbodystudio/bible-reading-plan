# Cloudflare에 올릴 때 쓰는 설정
name = "bible-push"
main = "src/index.js"
compatibility_date = "2026-09-01"

# 1분마다 깨어나서 알림 보낼 시간인지 확인
[triggers]
crons = ["* * * * *"]

# 알림 받을 폰 목록을 저장하는 곳
[[kv_namespaces]]
binding = "SUBS"
id = "43e06c225be4450194e5e10a4f88693f"

[vars]
VAPID_PUBLIC_KEY = "BDMTs3ZoJLc6_8OaMk9DXWlZdOtBpGKpf4OPtrLhg8pPx8n1CxSDdLTDBHU_y1mGzRygahEdECksE-VhFJA3QC8"
VAPID_SUBJECT = "https://ynbodystudio.github.io/bible-reading-plan/"
# VAPID_PRIVATE_KEY는 비밀값이라 여기 쓰지 않고 `wrangler secret put`으로 넣습니다.
